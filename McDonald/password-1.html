<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's 비밀번호 재설정 - 1</title>

    <link rel="stylesheet" href="../css/default.css">

    <style>
        @font-face {
            font-family: "Speedee";
            font-weight: 400;
            font-style: normal;
            font-display: swap;
            src: url("font/SPEEDEE-REGULAR.TTF") format("truetype");
        }

        @font-face {
            font-family: "Speedee";
            font-weight: 700;
            font-style: normal;
            font-display: swap;
            src: url("font/SPEEDEE-BOLD.TTF") format("truetype");
        }

        @font-face {
            font-family: "Pretendard Variable";
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
            src: url("font/PretendardVariable.ttf") format("truetype");
        }

        :root {
            --font-speedee: "Speedee", sans-serif;
            --font-pre: "Pretendard Variable", sans-serif;

            --primary: #FFCC00;
            --button: #FFBE0D;
            --text: #292929;
            --border: #707070;
            --placeholder: #a7a7a7;
            --error: #e23b2f;
            --rule: #cfcfcf;
            --rule-text: #bcbcbc;
        }

        html {
            font-size: 62.5%;
        }

        body {
            min-width: 360px;
            background-color: #fff;
            color: var(--text);
            font-family: var(--font-speedee);
            font-size: 1.6rem;
        }

        #wrap {
            width: 100%;
            max-width: 390px;
            min-width: 360px;
            min-height: 100dvh;
            margin: 0 auto;
            background-color: #fff;
        }

        header {
            position: relative;
            height: 141px;
            padding: 0 25px;
        }

        .prev_bttn {
            position: absolute;
            top: 92px;
            left: 25px;
            width: 12px;
            height: 12px;
            padding: 0;
            border: 0;
            border-left: 1.5px solid var(--text);
            border-bottom: 1.5px solid var(--text);
            background: transparent;
            transform: rotate(45deg);
        }

        main {
            min-height: calc(100dvh - 141px);
            padding: 0 25px 39px;
            display: flex;
            flex-direction: column;
        }

        .password_head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 76px;
        }

        .password_head h1 {
            margin: 0;
            font-family: var(--font-speedee);
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1;
        }

        .logo {
            display: block;
            width: 120px;
            height: auto;
        }

        .password_form {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .password_form fieldset {
            display: flex;
            flex-direction: column;
        }

        .password_form legend {
            margin-bottom: 14px;
            font-family: var(--font-speedee);
            font-size: 1.4rem;
            font-weight: 400;
        }

        .password_input_box {
            position: relative;
            width: 100%;
            height: 50px;
            margin-bottom: 18px;
        }

        .password_input_box input {
            width: 100%;
            height: 100%;
            padding: 0 48px 0 20px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background-color: #fff;
            color: var(--text);
            font-family: var(--font-speedee);
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 50px;
        }

        .password_input_box input::placeholder {
            color: var(--placeholder);
            opacity: 1;
            font-family: var(--font-speedee);
            font-weight: 700;
        }

        .password_view {
            position: absolute;
            top: 50%;
            right: 12px;
            width: 30px;
            height: 30px;
            padding: 0;
            border: 0;
            background: transparent url("img/mcEye.svg") no-repeat center / 30px 30px;
            transform: translateY(-50%);
        }

        .password_message {
            margin: -1px 0 12px;
            color: var(--error);
            font-family: var(--font-pre);
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .password_rules {
            display: flex;
            flex-direction: column;
        }

        .password_rule_list {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin: 0 0 12px;
            padding: 0;
            font-family: var(--font-pre);
            font-size: 1.3rem;
            line-height: 1.2;
            color: var(--rule-text);
        }

        .password_rule_list li {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .password_rule_list li::before {
            content: "✓";
            flex: 0 0 18px;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--rule-text);
        }

        .rule_line {
            width: 100%;
            height: 1px;
            background-color: #eeeeee;
        }

        .password_notice {
            margin-top: 12px;
            font-family: var(--font-pre);
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .complete_bttn {
            width: 100%;
            height: 56px;
            margin-top: auto;
            border: 1px solid #d19d00;
            border-radius: 30px;
            background-color: var(--button);
            color: var(--text);
            font-family: var(--font-speedee);
            font-size: 1.4rem;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div id="wrap">

        <header>
            <button type="button" class="prev_bttn">
                <span class="sr-only">이전</span>
            </button>
        </header>

        <main>
            <div class="password_head">
                <h1>비밀번호 재설정</h1>

                <img
                    src="img/Frame 42.png"
                    alt="My McDonald's"
                    class="logo"
                >
            </div>

            <form action="" class="password_form">
                <fieldset>
                    <legend>새 비밀번호 입력</legend>

                    <div class="password_input_box">
                        <label for="new-password" class="sr-only">새 비밀번호</label>
                        <input
                            type="password"
                            id="new-password"
                            name="password"
                            placeholder="비밀번호를 입력해주세요"
                        >
                        <button type="button" class="password_view" aria-label="비밀번호 보기">
                        </button>
                    </div>

                    <div class="password_input_box">
                        <label for="password-confirm" class="sr-only">비밀번호 확인</label>
                        <input
                            type="password"
                            id="password-confirm"
                            name="password_confirm"
                            placeholder="한번 더 입력해주세요"
                        >
                        <button type="button" class="password_view" aria-label="비밀번호 보기">
                        </button>
                    </div>

                    <p class="password_message">
                        최소 8글자 이상 ~ 최대 16글자까지 사용
                    </p>
                </fieldset>

                <section class="password_rules">
                    <h2 class="sr-only">비밀번호 설정 조건</h2>

                    <ul class="password_rule_list">
                        <li>최소 8글자 이상 최대 20글자</li>
                        <li>영어 대/소문자, 숫자, 특수문자 중 3개 이상 조합</li>
                        <li>아이디와 동일한 비밀번호 사용 불가</li>
                    </ul>

                    <div class="rule_line" aria-hidden="true"></div>

                    <p class="password_notice">
                        연속된 문자, 생년월일 / 전화번호 등 추측하기 쉬운 정보는 비밀번호로 사용할 수 없습니다.
                    </p>
                </section>

                <button type="submit" class="complete_bttn">
                    완료
                </button>
            </form>
        </main>

    </div>
</body>
</html>
